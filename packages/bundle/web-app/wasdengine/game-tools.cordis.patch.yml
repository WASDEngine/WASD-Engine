# WASDEngine fork: the Blender, ElevenLabs, GIMP, Godot, and SuperCollider game tools, on in every Web and Desktop
# profile, the Game tools tabs of Settings and the Plugins page that list them, and the MCP server through which other
# agents on this computer use them (wasdengine/FORK.md). Each application row starts without its application
# installed and reports setup steps through its tools; `elevenlabs` makes its audio through the WASDEngine API origin
# (the same expression as deepseek-account's inferenceOrigin in packages/bundle/base/wasdengine/
# gateway.cordis.patch.yml), which charges it to the signed-in account. A profile patch turns a row off with
# `- id: <row>` and `disabled: true`, which the Plugins page's Game tools tab writes. `ui-game-tools` mounts the tabs'
# browser half. `game-mcp` listens on
# 127.0.0.1:9273 and keeps its token and the connected agents' Sessions under `dataRoot`; `ui-game-mcp` mounts its
# browser half, the sign-in dialog's setup panel. `wasd-plugins` is WASD Engine Plugins, WASD Engine's own features:
# the Web export and release tools, the Release button, and Explore Games. The plugin manager refuses to switch it off
# (official-bundles PROTECTED_PLUGINS), so no Game tools switch offers it.
- insert:
    - id: blender
      name: '@deepseek-ai/dsh-blender'
      config:
        dataRoot: !!js dshHomePath('blender')
    - id: elevenlabs
      name: '@deepseek-ai/dsh-elevenlabs'
      config:
        apiOrigin: !!js >-
          ctx.get('launchEnvironment')?.getFrom('WASDENGINE_ORIGIN', ['process', 'user-env'])?.value || 'https://api.wasdengine.com'
    - id: gimp
      name: '@deepseek-ai/dsh-gimp'
      config:
        dataRoot: !!js dshHomePath('gimp')
    - id: godot
      name: '@deepseek-ai/dsh-godot'
      config:
        dataRoot: !!js dshHomePath('godot')
    - id: supercollider
      name: '@deepseek-ai/dsh-supercollider'
      config:
        dataRoot: !!js dshHomePath('supercollider')
    - id: ui-game-tools
      name: '@deepseek-ai/dsh-client-ui-game-tools'
    - id: game-mcp
      name: '@deepseek-ai/dsh-game-mcp'
      config:
        dataRoot: !!js dshHomePath('game-mcp')
    - id: ui-game-mcp
      name: '@deepseek-ai/dsh-client-ui-game-mcp'
    - id: wasd-plugins
      name: '@deepseek-ai/dsh-wasd-plugins'
