# WASDEngine fork: the Blender, ElevenLabs, GIMP, Godot, Poly Haven, and SuperCollider game tools and the game add-ons,
# on in every Web and Desktop profile, the Game tools tabs of Settings and the Plugins page that list them, and the MCP
# server through which other agents on this computer use them (wasdengine/FORK.md). Each application row starts without
# its application installed and reports setup steps through its tools; `polyhaven` needs no installation and makes no
# request until its first tool call, and `elevenlabs` makes its audio through the WASDEngine API origin (the same
# expression as deepseek-account's inferenceOrigin in packages/bundle/base/wasdengine/gateway.cordis.patch.yml), which
# charges it to the signed-in account. `game-addons` reads the add-on catalog shipped beside this file in `addons/`,
# downloads an add-on only when one is installed, and keeps its archives under `dataRoot`; Blender add-ons unpack into
# `blenderStore`, which the `blender` row's `addonStore` names for its workers. A profile patch turns a row off with
# `- id: <row>` and `disabled: true`, which the Plugins
# page's Game tools tab writes. `ui-game-tools` mounts the tabs' browser half. `game-mcp` listens on
# 127.0.0.1:9273 and keeps its token and the connected agents' Sessions under `dataRoot`; `ui-game-mcp` mounts its
# browser half, the sign-in dialog's setup panel. `wasd-plugins` is WASD Engine Plugins, WASD Engine's own features:
# the Web export and release tools, the Release button, Explore Games, and, in the Desktop profile, whose Browser tabs
# the window can drive (the `ui-sidebar-browser` row's condition), the agent's `browser_*` tools. The plugin manager
# refuses to switch it off (official-bundles PROTECTED_PLUGINS), so no Game tools switch offers it.
# `ui-game-assets` is the right Sidebar's Assets tab, which finds the game project's 2D and 3D art and shows images,
# models, their animations, and their details; `game-assets` gives the agent and connected agents the same view through
# `asset_search` and `asset_view`, whose pictures the Assets tab's browser half draws. `ui-game-audio` is the right
# Sidebar's Audio tab, which lists the project's sound effects, dialogue, and music and plays them with their waveform
# and details; `game-audio` gives the agent and connected agents `audio_search` and `audio_review`, whose measurements
# and picture the Audio tab's browser half makes.
- insert:
    - id: blender
      name: '@deepseek-ai/dsh-blender'
      config:
        dataRoot: !!js dshHomePath('blender')
        addonStore: !!js dshHomePath('game-addons', 'blender')
    - id: elevenlabs
      name: '@deepseek-ai/dsh-elevenlabs'
      config:
        apiOrigin: !!js >-
          ctx.get('launchEnvironment')?.getFrom('WASDENGINE_ORIGIN', ['process', 'user-env'])?.value || 'https://api.wasdengine.com'
    - id: game-addons
      name: '@deepseek-ai/dsh-game-addons'
      config:
        catalogDir: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-web-app/package.json')), 'wasdengine', 'addons')
        dataRoot: !!js dshHomePath('game-addons')
        blenderStore: !!js dshHomePath('game-addons', 'blender')
    - id: gimp
      name: '@deepseek-ai/dsh-gimp'
      config:
        dataRoot: !!js dshHomePath('gimp')
    - id: godot
      name: '@deepseek-ai/dsh-godot'
      config:
        dataRoot: !!js dshHomePath('godot')
    - id: polyhaven
      name: '@deepseek-ai/dsh-polyhaven'
    - id: supercollider
      name: '@deepseek-ai/dsh-supercollider'
      config:
        dataRoot: !!js dshHomePath('supercollider')
    - id: ui-game-tools
      name: '@deepseek-ai/dsh-client-ui-game-tools'
    - id: ui-game-assets
      name: '@deepseek-ai/dsh-client-ui-game-assets'
    - id: game-assets
      name: '@deepseek-ai/dsh-game-assets'
    - id: ui-game-audio
      name: '@deepseek-ai/dsh-client-ui-game-audio'
    - id: game-audio
      name: '@deepseek-ai/dsh-game-audio'
    - id: game-mcp
      name: '@deepseek-ai/dsh-game-mcp'
      config:
        dataRoot: !!js dshHomePath('game-mcp')
    - id: ui-game-mcp
      name: '@deepseek-ai/dsh-client-ui-game-mcp'
    - id: wasd-plugins
      name: '@deepseek-ai/dsh-wasd-plugins'
      config:
        browser: !!js "ctx.get('profileContext')?.name === 'desktop'"
