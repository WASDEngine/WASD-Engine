# WASDEngine fork: the Blender, ElevenLabs, GIMP, Godot, Nano Banana image generation, Poly Haven, SuperCollider, and
# Tripo game tools and the game add-ons, on in every Web and Desktop profile, the Game tools tabs of Settings and the
# Plugins page that list them, and the MCP server through which other agents on this computer use them
# (wasdengine/FORK.md). Each application row starts without its application installed and reports setup steps through
# its tools; `polyhaven` needs no installation and makes no request until its first tool call, and `elevenlabs`,
# `image-generation`, and `tripo` make their audio, images, and 3D models through the WASDEngine API origin (the same
# expression as deepseek-account's inferenceOrigin in packages/bundle/base/wasdengine/gateway.cordis.patch.yml), which
# charges them to the signed-in account.
# `game-addons` reads the add-on catalog shipped beside this file in `addons/`,
# downloads an add-on only when one is installed, and keeps its archives under `dataRoot`; Blender add-ons unpack into
# `blenderStore`, which the `blender` row's `addonStore` names for its workers. A profile patch turns a row off with
# `- id: <row>` and `disabled: true`, which the Plugins
# page's Game tools tab writes. `ui-game-tools` mounts the tabs' browser half. `game-mcp` listens on
# 127.0.0.1:9273, keeps its token and the connected agents' Sessions under `dataRoot`, and ends the result of
# `create_game_project` with `newGameGuidance`; `ui-game-mcp` mounts its browser half, the sign-in dialog's setup
# panel. `wasd-plugins` is WASD Engine Plugins, WASD Engine's own features:
# the Web export and release tools, which record under `dataRoot` which project folders released each game, the Export /
# Share and Multiplayer buttons, the Play page and its Play and Build switch, and, in the Desktop profile, whose Browser
# tabs the window can drive (the `ui-sidebar-browser` row's condition), the agent's `browser_*` tools and the game
# library, which installs games from the site under `dataRoot` and starts them. The plugin manager
# refuses to switch it off (official-bundles PROTECTED_PLUGINS), so no Game tools switch offers it.
# `ui-game-assets` is the right Sidebar's Assets tab, which finds the game project's 2D and 3D art and shows images,
# models, their animations, and their details; `game-assets` gives the agent and connected agents the same view through
# `asset_search` and `asset_view`, whose pictures the Assets tab's browser half draws. `ui-game-audio` is the right
# Sidebar's Audio tab, which lists the project's sound effects, dialogue, and music and plays them with their waveform
# and details; `game-audio` gives the agent and connected agents `audio_search` and `audio_review`, whose measurements
# and picture the Audio tab's browser half makes. `art-references` gives the agent and connected agents
# `reference_search` and `reference_save`, which find reference images for art on the web, through the `web` row's
# search and the pages it finds, and save the chosen ones into the game project's `references/` folder, with downloads
# and contact sheets cached under `dataRoot`; its system prompt section has the agent gather references before it makes
# art. `graphics-review` gives the agent and connected agents `graphics_review`, which sends an image of the game's
# graphics to the account's model route with a reviewer's instructions and returns its notes; its system prompt
# section asks for one to three reviews of each piece of graphics the agent makes and none of downloaded assets.
# `godot` reads its `webCheckCommand` from `WASD_WEB_CHECK_COMMAND`, which the Desktop app sets for its Host to the
# command that starts the app's Web check mode; without it, as in the Web profile, Web checks are off.
- insert:
    - id: blender
      name: '@deepseek-ai/dsh-blender'
      config:
        dataRoot: !!js dshHomePath('blender')
        addonStore: !!js dshHomePath('game-addons', 'blender')
    - id: elevenlabs
      name: '@deepseek-ai/dsh-elevenlabs'
      config:
        apiOrigin: !!js >-
          ctx.get('launchEnvironment')?.getFrom('WASDENGINE_ORIGIN', ['process', 'user-env'])?.value || 'https://api.wasdengine.com'
    - id: game-addons
      name: '@deepseek-ai/dsh-game-addons'
      config:
        catalogDir: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-web-app/package.json')), 'wasdengine', 'addons')
        dataRoot: !!js dshHomePath('game-addons')
        blenderStore: !!js dshHomePath('game-addons', 'blender')
    - id: gimp
      name: '@deepseek-ai/dsh-gimp'
      config:
        dataRoot: !!js dshHomePath('gimp')
    - id: godot
      name: '@deepseek-ai/dsh-godot'
      config:
        dataRoot: !!js dshHomePath('godot')
        webCheckCommand: !!js >-
          JSON.parse(ctx.get('launchEnvironment')?.getFrom('WASD_WEB_CHECK_COMMAND', ['process'])?.value || '[]')
    - id: image-generation
      name: '@deepseek-ai/dsh-image-generation'
      config:
        apiOrigin: !!js >-
          ctx.get('launchEnvironment')?.getFrom('WASDENGINE_ORIGIN', ['process', 'user-env'])?.value || 'https://api.wasdengine.com'
    - id: polyhaven
      name: '@deepseek-ai/dsh-polyhaven'
    - id: supercollider
      name: '@deepseek-ai/dsh-supercollider'
      config:
        dataRoot: !!js dshHomePath('supercollider')
    - id: tripo
      name: '@deepseek-ai/dsh-tripo'
      config:
        apiOrigin: !!js >-
          ctx.get('launchEnvironment')?.getFrom('WASDENGINE_ORIGIN', ['process', 'user-env'])?.value || 'https://api.wasdengine.com'
    - id: ui-game-tools
      name: '@deepseek-ai/dsh-client-ui-game-tools'
    - id: ui-game-assets
      name: '@deepseek-ai/dsh-client-ui-game-assets'
    - id: game-assets
      name: '@deepseek-ai/dsh-game-assets'
    - id: ui-game-audio
      name: '@deepseek-ai/dsh-client-ui-game-audio'
    - id: game-audio
      name: '@deepseek-ai/dsh-game-audio'
    - id: art-references
      name: '@deepseek-ai/dsh-art-references'
      config:
        dataRoot: !!js dshHomePath('art-references')
    - id: graphics-review
      name: '@deepseek-ai/dsh-graphics-review'
    - id: game-mcp
      name: '@deepseek-ai/dsh-game-mcp'
      config:
        dataRoot: !!js dshHomePath('game-mcp')
        # The lines that the gamedev preset's new-game-guidance row adds after the first prompt for a new game, without
        # its request to work without asking questions, which a connected agent takes only from its user.
        newGameGuidance: |-
          These additional instructions are the recommended prompt for building games with WASD Engine. Do your absolute best to follow them:
          * Put your effort into making what's on screen look, move and sound great
          * People and humanoid figures should look and move like real people, with fitting animations
          * The environment should be believable, textured, with lighting that sells the mood
          * Run and play the demo yourself and fix anything that looks or plays wrong before you finish
    - id: ui-game-mcp
      name: '@deepseek-ai/dsh-client-ui-game-mcp'
    - id: wasd-plugins
      name: '@deepseek-ai/dsh-wasd-plugins'
      config:
        browser: !!js "ctx.get('profileContext')?.name === 'desktop'"
        library: !!js "ctx.get('profileContext')?.name === 'desktop'"
        dataRoot: !!js dshHomePath('wasd-plugins')
