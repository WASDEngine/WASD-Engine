# WASDEngine fork: the Blender, GIMP, and Godot game tools, on in every Web and Desktop profile, the Game tools
# tabs of Settings and the Plugins page that list them, and the MCP server through which other agents on this
# computer use them (wasdengine/FORK.md). Each tool row starts without its application installed and reports setup
# steps through its tools; a profile patch turns one off with `- id: <row>` and `disabled: true`, which the Plugins
# page's Game tools tab writes. `ui-game-tools` mounts the tabs' browser half. `game-mcp` listens on 127.0.0.1:9273
# and keeps its token and the connected agents' Sessions under `dataRoot`; `ui-game-mcp` mounts its browser half,
# the sign-in dialog's setup panel.
- insert:
    - id: blender
      name: '@deepseek-ai/dsh-blender'
      config:
        dataRoot: !!js dshHomePath('blender')
    - id: gimp
      name: '@deepseek-ai/dsh-gimp'
      config:
        dataRoot: !!js dshHomePath('gimp')
    - id: godot
      name: '@deepseek-ai/dsh-godot'
      config:
        dataRoot: !!js dshHomePath('godot')
    - id: ui-game-tools
      name: '@deepseek-ai/dsh-client-ui-game-tools'
    - id: game-mcp
      name: '@deepseek-ai/dsh-game-mcp'
      config:
        dataRoot: !!js dshHomePath('game-mcp')
    - id: ui-game-mcp
      name: '@deepseek-ai/dsh-client-ui-game-mcp'
