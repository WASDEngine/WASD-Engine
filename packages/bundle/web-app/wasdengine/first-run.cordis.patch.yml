# WASDEngine first-run overlay (fork-owned; wasdengine/FORK.md lists the fork
# changes). It is a dsh-web-app patch layer, so the Web and Desktop profiles load
# it. First use shows no DeepSeek Harness preview notice, asks for an account or
# an API key in the main window's Get started dialog in the Desktop app too (the
# Desktop brand turns the standalone welcome window off), offers account sign-in
# as the only way in (no Models settings section and no API key step; the
# ui-settings-account row of telemetry.cordis.patch.yml drops Add API Key from the
# sign-in dialog), and creates no default
# Workspace: the Create game project dialog of ui-workspace asks for the first
# game project instead, through the gameProject Remote that the Workspace
# controller serves.
- id: ui-settings-models
  config:
    apiKeyEntry: false
    nativeCredentialOnboarding: false
    welcomeNotice: false

- id: workspace-controller
  config:
    defaultWorkspace: false
