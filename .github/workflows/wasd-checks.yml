# The fork's checks on every push to main and every pull request: the build, the vitest runs that steps 3 to 7 of
# the merge checklist name (wasdengine/FORK.md), the recorded-session snapshot replays, the runtime script tests, the
# documentation checks of step 10, and, in a job of its own, the game tools' end-to-end suites.
# Upstream's CI targets DeepSeek's runners and secrets, so the fork deletes it; this workflow runs the part the fork
# relies on, on macOS, where the fork is developed.
#
# Actions are pinned to full commit SHAs (the release is noted beside each).
name: WASD checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: wasd-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test runs never report to the telemetry endpoint the CLI profile names.
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Build and fork checks
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm release that package.json's packageManager names.
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Fork specs and the upstream specs the fork edits
        run: >-
          pnpm exec vitest run
          packages/bundle
          packages/client/ui-settings-account/tests
          packages/credentials/deepseek-account/tests/wasdengine-allowance.spec.ts
          packages/credentials/deepseek-account/tests/wasdengine-auto-recharge.spec.ts
          packages/credentials/deepseek-account/tests/remote.spec.ts
          packages/credentials/deepseek-account/tests/wasdengine-harness-origin.spec.ts
          packages/web/web-deepseek-api/tests/wasdengine-usage-limit.spec.ts
          apps/desktop/tests
          packages/util/home-paths/tests
          packages/shell/shell-env/tests
          packages/context/agent-instructions/tests
          scripts/verify-dsh-package-licenses.spec.ts
          apps/cli/tests/windows-shell.spec.ts
          packages/core/system-prompt/tests/system-prompt.spec.ts
          packages/core/agent-loop/tests/loop.spec.ts
          packages/preset/persona/tests/persona.spec.ts
          packages/fs/tool-fs/tests/tools.spec.ts
          packages/fs/tool-fs-search/tests/tools.spec.ts
          packages/web/tool-web/tests/tool-web.spec.ts
          packages/context/harness-dev-context/tests/harness-dev-context.spec.ts
          scripts/rescope-vendor.spec.ts
          packages/client/ui-brand-official
          packages/client/ui-chat
          packages/client/ui-sidebar-right
          packages/client/ui-sidebar/tests
          apps/web/tests/app-icons.spec.ts
          apps/web/tests/wasdengine-app-icons.spec.ts
          packages/client/locale/tests/wasdengine-copy.client.spec.ts
          packages/client/web/tests/boot-page.client.spec.ts
          packages/client/ui-plugin-manager/tests/wasdengine-copy.client.spec.ts
          packages/client/ui-sidebar-documentpreview/tests/wasdengine-copy.client.spec.ts
          packages/client/ui-sidebar-documentpreview/tests/office-registration.client.spec.ts
          packages/experimental/cua/tests/wasdengine-copy.client.spec.ts
          packages/api/workspace-controller
          packages/client/ui-workspace
          packages/client/ui-conversation
          packages/client/ui-model-selection
          packages/api/session-controller/tests/session-models.host.spec.ts
          packages/api/session-controller/tests/wasdengine-question-answer.host.spec.ts
          packages/api/session-controller/tests/wasdengine-question-answer.client.spec.ts
          packages/client/ui-settings-models
          packages/experimental/client-ui-forge
          packages/experimental/liveshare/tests/endpoint-classification.client.spec.ts
          packages/client/ui-agent-preset
          packages/preset/agent-preset-registry
          packages/client/ui-settings-plugin-inventory
          packages/client/ui-settings-general
          packages/client/ui-entry-customization
          packages/gamedev
          packages/api/remotes/tests
          packages/mcp/mcp-client
          packages/client/ui-plugin-manager/tests/components.client.spec.tsx
          packages/util/official-bundles
          scripts/optional-bundles.spec.ts
          scripts/wasdengine-absent-paths.spec.ts
          packages/client/ui-theme/tests
          packages/client/ui-sidebar-browser
          packages/client/ui-primitives/tests/web-block.client.spec.tsx
          packages/client/ui-primitives/tests/wasdengine-web-block-links.client.spec.tsx
          packages/client/ui-tool/tests/web-card.client.spec.tsx
          packages/client/ui-tool/tests/tool-row.client.spec.tsx
          packages/client/ui-tool/tests/wasdengine-web-links.client.spec.tsx
          packages/client/ui-user-questions
          scripts/client-bundle-purity.spec.ts

      # Keyless: every case replays its recorded model responses through the shipped profiles, the fork's overlay included.
      - name: Recorded-session snapshot replays
        run: pnpm run test:snapshot

      - name: Runtime script tests
        run: |
          python3 -B -m unittest discover --start-directory wasdengine/libgodot --pattern 'test_*.py'
          python3 -B -m unittest discover --start-directory wasdengine/supercollider --pattern 'test_*.py'
          python3 -B -m unittest discover --start-directory wasdengine/gimp --pattern 'test_*.py'
          python3 -B -m unittest discover --start-directory wasdengine/blender --pattern 'test_*.py'
          python3 -B -m unittest discover --start-directory wasdengine/web-template --pattern 'test_*.py'

      # The doc-sync gates read only the checked-out commit and its files, so the shallow checkout is enough.
      # The macos-15 runner has 7 GB of memory, where Node's default heap (about a quarter of it) is too small for the
      # doc graphs and the documentation build; each gate gets a 4 GB heap, and they run one at a time to fit.
      - name: Documentation checks
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          DSH_GATE_CONCURRENCY: '1'
        run: |
          node wasdengine/brand-docs.mjs --check
          pnpm run doc-sync

  # The game tools' end-to-end suites against the runtimes that the Desktop app ships for macOS, LibGodot, Blender's bpy,
  # GIMP, and SuperCollider, downloaded from their pinned releases and checked against their digests
  # (apps/desktop/scripts/wasdengine-e2e-runtimes.ts), as step 7 of the merge checklist runs them. The suites run their
  # workers from source, so no build is needed. A suite skips its tests when it finds no runtime, which would pass
  # silently, so the job fails a suite that passed no test.
  e2e:
    name: Game tools end-to-end
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm release that package.json's packageManager names.
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage the runtimes that the Desktop app ships
        run: pnpm --filter @deepseek-ai/dsh-desktop exec tsx scripts/wasdengine-e2e-runtimes.ts --env-out "$GITHUB_ENV"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # The Blender add-on suite and the bpy module worker suite run bpy offline from uv's cache, as the Blender
      # plugin's uv environment does.
      - name: Cache bpy 5.2.3 for the Blender suites
        run: uv run --python 3.13 --no-project --with bpy==5.2.3 python -I -c 'import bpy'

      - name: Run the end-to-end suites
        run: |
          report="$RUNNER_TEMP/e2e-report.json"
          pnpm exec vitest run --config vitest.e2e.config.ts --reporter=default --reporter=json --outputFile.json="$report" \
            packages/gamedev/godot/tests packages/gamedev/blender/tests packages/gamedev/gimp/tests \
            packages/gamedev/supercollider/tests packages/gamedev/wasd-plugins/tests/multiplayer-addon.e2e.ts
          node --input-type=module -e '
            import { readFileSync } from "node:fs"
            const { testResults } = JSON.parse(readFileSync(process.argv[1], "utf8"))
            let empty = 0
            for (const result of testResults) {
              const passed = result.assertionResults.filter(test => test.status === "passed").length
              console.log(`${result.name}: ${passed} tests passed`)
              if (passed === 0) { console.log(`::error::${result.name} passed no test: it found no runtime`); empty += 1 }
            }
            process.exit(empty === 0 ? 0 : 1)
          ' "$report"
